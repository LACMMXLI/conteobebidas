server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # No cachear el service worker ni el manifest para que las actualizaciones
    # de la PWA lleguen sin fricción.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: cualquier ruta no encontrada regresa a index.html (React Router).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
